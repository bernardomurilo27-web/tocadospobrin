<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toca dos Pobrin</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            color: white;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 38px;
            font-weight: 700;
            color: #ffb500;
            text-shadow: 0 0 15px #ffb50099;
        }

        .container {
            max-width: 950px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: #111;
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: row;
            gap: 25px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 25px rgba(255, 165, 0, 0.25);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 35px rgba(255, 180, 0, 0.4);
        }

        .card img {
            width: 350px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 0 20px #000;
        }

        .info {
            flex: 1;
        }

        .info h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffdf6e;
            text-shadow: 0 0 10px #ffdf6e99;
        }

        .btn {
            display: inline-block;
            padding: 15px 25px;
            background: #ffb500;
            color: #000;
            text-decoration: none;
            font-size: 20px;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 0 15px #ffb500bb;
            transition: 0.25s;
        }

        .btn:hover {
            background: #ffd900;
            box-shadow: 0 0 25px #ffd900;
        }

        /* Responsivo */
        @media (max-width: 780px) {
            .card {
                flex-direction: column;
                text-align: center;
            }

            .card img {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>TOCA DOS POBRIN — Produtos Oficiais</h1>
</header>

<div class="container">
    <div class="card">
        <img src="produto.png" alt="Produto">
        <div class="info">
            <h2>Produto Exclusivo</h2>
            <div class="price">R$ 79,99</div>
            <a class="btn" href="https://wa.me/SEUNUMERO" target="_blank">Comprar no WhatsApp</a>
        </div>
    </div>
</div>

<script>
    // Efeito suave ao entrar
    document.addEventListener("DOMContentLoaded", () => {
        document.body.style.opacity = 0;
        setTimeout(() => {
            document.body.style.transition = "1s";
            document.body.style.opacity = 1;
        }, 100);
    });
</script>

</body>
</html>
