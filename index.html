<script>
// Código JavaScript puro para girar produtos
document.write(`
<style>
.product-circle {
    width: 300px;
    height: 300px;
    position: relative;
    margin: 50px auto;
}
.spin-item {
    position: absolute;
    width: 80px;
    height: 80px;
    background: #8a2bff;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    left: 50%;
    top: 50%;
    transform-origin: 0 0;
}
</style>

<div class="product-circle" id="circle"></div>
<button onclick="spin()">GIRAR</button>

<script>
function spin() {
    const circle = document.getElementById('circle');
    const products = ['Spotify', 'Voleibol', 'Blox', 'Conta', 'Adobe', 'Premium'];
    
    circle.innerHTML = '';
    
    products.forEach((prod, i) => {
        const item = document.createElement('div');
        item.className = 'spin-item';
        item.textContent = prod;
        item.style.transform = `rotate(${i * 60}deg) translate(150px) rotate(-${i * 60}deg)`;
        circle.appendChild(item);
    });
}
spin();
<\/script>
`);
</script>
